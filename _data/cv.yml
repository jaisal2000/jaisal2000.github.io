    Projects:
      - name: "GraLLM-Tutor: An Explainable AI Framework"
        summary: "LLM + Knowledge Graph integration for educational AI systems"
        highlights:
          - "Engineered a novel explainable AI (XAI) framework that synergizes a large language model (Llama 3) with a structured commonsense knowledge graph (ConceptNet) to ground AI-generated answers in verifiable logic"
          - "Developed an automated reasoning pipeline that performs LLM-based concept extraction, queries for relational paths via the ConceptNet API, and synthesizes disparate knowledge fragments into a clear explanation"
        start_date: 2025-04-01
        end_date: 2025-04-30
        technologies: "Llama 3, ConceptNet, GNNs, Python"

      - name: "SemDiff-QA: Semantic Differentiation for Multi-Choice Question Answering"
        summary: "MCQA using discriminative ranking approach"
        highlights:
          - "Implemented the DCQA research paper (ECAI 2024) by re-architecting a T5-Base model into a discriminative ranker, shifting from text generation to list-wise classification to resolve semantic drift"
          - "Engineered a memory-efficient training pipeline using Mixed Precision (FP16) and gradient accumulation to optimize performance on T4 GPUs, achieving 60.52% accuracy on the CommonsenseQA dataset"
        start_date: 2025-11-01
        end_date: 2025-11-30
        technologies: "T5-Base, PyTorch, Mixed Precision Training"

      - name: "Defending Against RAG Prompt Injection Using DPO-Based Fine-Tuning"
        summary: "Security in RAG systems against adversarial attacks"
        highlights:
          - "Executed advanced Indirect Prompt Injection attacks on RAG systems using multi-turn poisoned knowledge bases and automatically generated adversarial queries"
          - "Implemented a Direct Preference Optimization (DPO) defense with LoRA adapters, training the LLM to resist subtle non-imperative misinformation while preserving utility on benign queries"
        start_date: 2025-04-01
        end_date: 2025-04-30
        technologies: "RAG, DPO, LoRA, LLMs, Security"

      - name: Medical Chatbot & Knowledge Retrieval Systems
        summary: "RAG-based medical research assistant application"
        highlights:
          - "Developed an AI-powered medical research assistant using LangChain and Pinecone, implementing advanced document retrieval techniques to process 5,699 text chunks from clinical literature"
          - "Engineered a hybrid NLP pipeline combining dense vector embeddings with LLM's generative capabilities"
        start_date: 2024-06-01
        end_date: 2024-06-30
        technologies: "LangChain, Pinecone, RAG, Vector Embeddings"

      - name: Image Colorization using Deep Learning (GANs)
        summary: "Computer vision application using generative models"
        highlights:
